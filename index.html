<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the photos run up under a phone's notch; the
         app keeps its text clear of it (--frame-top in App.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Unfold · Japan</title>
    <meta name="description" content="Curated. Authentic. Unforgettable. Guided journeys in Japan." />

    <!-- Installing it on a phone. The app's name here and in the manifest
         isn't read from src/config.js, so change it in both if it changes. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16171d" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Unfold" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
